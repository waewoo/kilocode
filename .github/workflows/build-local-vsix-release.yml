name: Build and release local VSIX

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v7.4.22-null-content-fix)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Zig for Linux sandbox helpers
        shell: bash
        run: |
          set -euxo pipefail
          echo "[START] Zig setup: $(date -Is)"
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
          echo "[DONE] Zig setup: $(date -Is)"

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail
          echo "[START] bun install: $(date -Is)"
          bun install --frozen-lockfile
          echo "[DONE] bun install: $(date -Is)"

      - name: Install VSCE
        shell: bash
        run: |
          set -euxo pipefail
          echo "[START] VSCE install: $(date -Is)"
          bun install --global @vscode/vsce
          vsce --version
          echo "[DONE] VSCE install: $(date -Is)"

      - name: Show build environment
        shell: bash
        working-directory: packages/kilo-vscode
        run: |
          set -euxo pipefail
          echo "Timestamp: $(date -Is)"
          echo "PWD: $(pwd)"
          echo "Node: $(node --version)"
          echo "Bun: $(bun --version)"
          echo "VSCE: $(vsce --version)"
          echo "Zig: $(zig version)"
          echo "Disk:"
          df -h
          echo "Memory:"
          free -h
          echo "Package scripts:"
          node -e 'const p=require("./package.json"); console.log(JSON.stringify(p.scripts,null,2))'

      - name: Build KiloCode extension with bun
        shell: bash
        working-directory: packages/kilo-vscode
        timeout-minutes: 15
        env:
          CI: "true"
          FORCE_COLOR: "1"
        run: |
          set -euxo pipefail
          echo "[START] bun run package: $(date -Is)"
          /usr/bin/time -v bun run package
          rc=$?
          echo "[END] bun run package: $(date -Is) exit=$rc"
          exit $rc

      - name: Inspect build output
        shell: bash
        working-directory: packages/kilo-vscode
        run: |
          set -euxo pipefail
          echo "[START] Inspect output: $(date -Is)"
          du -sh . || true
          find . -maxdepth 3 -type f \( -name '*.js' -o -name '*.json' -o -name '*.wasm' \) | head -200
          echo "[DONE] Inspect output: $(date -Is)"

      - name: Package Linux x64 VSIX with VSCE
        shell: bash
        working-directory: packages/kilo-vscode
        timeout-minutes: 10
        run: |
          set -euxo pipefail
          echo "[START] vsce package: $(date -Is)"
          mkdir -p out
          /usr/bin/time -v vsce package --no-dependencies --skip-license --target linux-x64 \
            -o "out/kilo-vscode-${{ inputs.release_tag }}-linux-x64.vsix"
          rc=$?
          echo "[END] vsce package: $(date -Is) exit=$rc"
          ls -lh out/
          exit $rc

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilo-vscode-${{ inputs.release_tag }}-linux-x64
          path: packages/kilo-vscode/out/*.vsix
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: KiloCode ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: packages/kilo-vscode/out/*.vsix
