name: Build and release local VSIX

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create (for example v7.4.11-null-content-fix)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-vsix:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Zig for Linux sandbox helpers
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install VSCE
        run: bun install --global @vscode/vsce

      - name: Build and package Linux x64 VSIX
        working-directory: packages/kilo-vscode
        run: |
          bun run package
          mkdir -p out
          vsce package --no-dependencies --skip-license --target linux-x64 \
            -o "out/kilo-vscode-${{ inputs.release_tag }}-linux-x64.vsix"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kilo-vscode-${{ inputs.release_tag }}-linux-x64
          path: packages/kilo-vscode/out/*.vsix
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: KiloCode ${{ inputs.release_tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: packages/kilo-vscode/out/*.vsix
